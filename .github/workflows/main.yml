name: Execució de Tests Bloc 3

on: [push]

jobs:
  proves:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codi
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Unittest
        run: |
          cd Unittest
          python -m unittest test_Unittest.py
